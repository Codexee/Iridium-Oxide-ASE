name: Verify Hamiltonian

on:
  push:
    paths:
      - 'artifacts/hamiltonian-o69-q0-spin0-jw/fermionic_active_space.npz'
      - 'scripts/export_qubit_hamiltonian_json.py'
      - 'scripts/exact_diagonalize_qubit_hamiltonian_patched.py'
  workflow_dispatch:
  
jobs:
  verify-hamiltonian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
  
      - name: Install dependencies
        run: pip install numpy scipy openfermion
  
      - name: Export qubit Hamiltonian from committed NPZ
        run: |
          python scripts/export_qubit_hamiltonian_json.py \
            artifacts/hamiltonian-o69-q0-spin0-jw/fermionic_active_space.npz \
            --mapping jw \
            --out artifacts/hamiltonian-o69-q0-spin0-jw/qubit_hamiltonian_jw.json
  
      - name: Exact diagonalisation
        run: |
          python scripts/exact_diagonalize_qubit_hamiltonian_patched.py \
            artifacts/hamiltonian-o69-q0-spin0-jw/qubit_hamiltonian_jw.json \
            --fermionic-json artifacts/hamiltonian-o69-q0-spin0-jw/fermionic_active_space.json \
            --k 4
  
      - name: Verify energy bookkeeping
        run: |
          python - <<'EOF'
          import json
          diag = json.load(open("artifacts/hamiltonian-o69-q0-spin0-jw/qubit_hamiltonian_jw_exact_diag.json"))
          ferm = json.load(open("artifacts/hamiltonian-o69-q0-spin0-jw/fermionic_active_space.json"))
          ecore = ferm["ecore"]
          gs = diag["ground_state_energy_hartree"]
          total = ecore + gs
          rhf = -27782.4761794914
          diff = abs(total - rhf)
          print(f"ecore + eigenvalue = {total:.6f}")
          print(f"RHF reference      = {rhf:.6f}")
          print(f"Difference         = {diff:.6f} Hartree")
          assert diff < 0.01, f"Energy mismatch too large: {diff:.6f} Hartree"
          print("PASS: energy bookkeeping correct")
          EOF
