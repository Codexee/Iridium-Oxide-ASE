name: IrO2 pseudopotential QE input generation

on:
  push:
    branches:
      - dev/pseudopotential-integration
    paths:
      - "legacy_scripts/generate_states.py"
      - "scripts/write_qe_pseudopotential_input.py"
      - "inputs/state_set.json"
      - "inputs/*.in"
      - "inputs/pseudopotentials/**"
      - ".github/workflows/pseudopotential-qe-inputs.yml"
      - "environment.yml"

  workflow_dispatch:
    inputs:
      site:
        description: "Site to process: all, clean, or one H site such as 69"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - clean
          - "21"
          - "22"
          - "23"
          - "44"
          - "46"
          - "47"
          - "69"
          - "71"
      calculation:
        description: "QE calculation type to write"
        required: true
        default: "scf"
        type: choice
        options:
          - scf
          - relax
          - vc-relax

permissions:
  contents: read

jobs:
  prepare-states:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate: false

      - name: Create conda environment
        shell: bash -l {0}
        run: |
          set -euo pipefail
          conda env create -f environment.yml || true
          conda run -n iro2 python -c "import numpy, ase, yaml; print('env ok')"
      - name: Restore generated states cache
        id: states-cache
        uses: actions/cache@v4
        with:
          path: outputs/states
          key: iro2-generated-states-${{ hashFiles('scripts/generate_states.py', 'scripts/iro2_slab_setup.py', 'inputs/state_set.json', 'inputs/*.in') }}
          restore-keys: |
            iro2-generated-states-

      - name: Generate states if cache is missing
        if: steps.states-cache.outputs.cache-hit != 'true'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          rm -rf outputs/states || true
          mkdir -p outputs
          conda run -n iro2 python -u legacy_scripts/generate_states.py \
                  --state_set inputs/state_set.json \
                  --outputs outputs
          find outputs/states -name "*.traj"

      - name: Show available states
        shell: bash -l {0}
        run: |
          set -euo pipefail
          find outputs/states -name "*.traj" | sort

      - name: Upload generated states for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: generated-states-for-pseudopotential
          path: outputs/states/
          retention-days: 14

  write-qe-pseudopotential-inputs:
    runs-on: ubuntu-latest
    needs: prepare-states

    strategy:
      fail-fast: false
      matrix:
        site: [21, 22, 23, 44, 46, 47, 69, 71, clean]

    steps:
      - uses: actions/checkout@v4

      - name: Skip sites not requested
        id: gate
        shell: bash
        run: |
          set -euo pipefail
                REQUESTED="${{ github.event.inputs.site }}"
                CURRENT="${{ matrix.site }}"
                  
                if [ -z "${REQUESTED}" ]; then
                  REQUESTED="all"
                fi

      - name: Set up Miniconda
        if: steps.gate.outputs.run_site == 'true'
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate: false

      - name: Create conda environment
        if: steps.gate.outputs.run_site == 'true'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          conda env create -f environment.yml || true
          conda run -n iro2 python -c "import numpy, ase, yaml; print('env ok')"

      - name: Download generated states
        if: steps.gate.outputs.run_site == 'true'
        uses: actions/download-artifact@v4
        with:
          name: generated-states-for-pseudopotential
          path: outputs/states/

      - name: Select structure
        if: steps.gate.outputs.run_site == 'true'
        shell: bash -l {0}
        run: |
          set -euo pipefail

          if [ "${{ matrix.site }}" = "clean" ]; then
            TRAJ="outputs/states/clean/structures/slab_clean_ready.traj"
            OUTDIR="outputs/qe/clean"
            PREFIX="iro2_clean"
          else
            TRAJ="outputs/states/H_star/structures/slab_H_o${{ matrix.site }}_ready.traj"
            OUTDIR="outputs/qe/H_star/o${{ matrix.site }}"
            PREFIX="iro2_h_o${{ matrix.site }}"
          fi

          echo "TRAJ=${TRAJ}" >> "$GITHUB_ENV"
          echo "OUTDIR=${OUTDIR}" >> "$GITHUB_ENV"
          echo "PREFIX=${PREFIX}" >> "$GITHUB_ENV"

          ls -l "${TRAJ}"

      - name: Write QE pseudopotential input
        if: steps.gate.outputs.run_site == 'true'
        shell: bash -l {0}
        run: |
              set -euo pipefail
              mkdir -p "${OUTDIR}"
          
              CALCULATION="${{ github.event.inputs.calculation }}"
              if [ -z "${CALCULATION}" ]; then
                CALCULATION="scf"
              fi
          
              conda run -n iro2 python -u scripts/write_qe_pseudopotential_input.py \
                "${TRAJ}" \
                --manifest inputs/pseudopotentials/pseudopotential_manifest.yaml \
                --output "${OUTDIR}/${PREFIX}_pseudo.in" \
                --metadata-output "${OUTDIR}/${PREFIX}_pseudo_metadata.json" \
                --calculation "${CALCULATION}" \
                --prefix "${PREFIX}"
          
              ls -l "${OUTDIR}"

      - name: Upload QE pseudopotential input
        if: steps.gate.outputs.run_site == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qe-pseudopotential-${{ matrix.site }}
          path: outputs/qe/**
          retention-days: 30
